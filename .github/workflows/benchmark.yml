name: benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per pair
        default: "5"
      runners:
        description: Runners to test
        default: all
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - benches/**
      - harness/**
      - scripts/**
      - .github/workflows/benchmark.yml

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      benches: ${{ steps.list.outputs.benches }}
      hermes_ref: ${{ steps.list.outputs.hermes_ref }}
      porffor_ref: ${{ steps.list.outputs.porffor_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "benches=$(ls benches | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "hermes_ref=$(git ls-remote https://github.com/facebook/hermes.git refs/heads/static_h | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "porffor_ref=$(git ls-remote https://github.com/CanadaHonk/porffor.git refs/heads/main | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-tools:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Cache vendored toolchains
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor/
          key: vendor-${{ runner.os }}-${{ needs.plan.outputs.hermes_ref }}-${{ needs.plan.outputs.porffor_ref }}-${{ hashFiles('scripts/setup.sh') }}
          restore-keys: |
            vendor-${{ runner.os }}-${{ needs.plan.outputs.hermes_ref }}-

      - name: Install build tools
        if: steps.cache-vendor.outputs.cache-hit != 'true' || hashFiles('vendor/hermes/build/bin/shermes') == ''
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends time clang ninja-build libicu-dev

      - name: Setup vendored toolchains
        if: steps.cache-vendor.outputs.cache-hit != 'true' || hashFiles('vendor/hermes/build/bin/shermes') == ''
        run: |
          npm ci
          ./scripts/setup.sh

      - name: Upload vendor artifact for shards
        uses: actions/upload-artifact@v4
        with:
          name: vendor-bundle
          path: vendor/
          retention-days: 1

  bench:
    needs: [plan, build-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One job per bench: every runner in a given row is measured on the same
      # machine, which is what the comparison actually depends on.
      matrix:
        bench: ${{ fromJSON(needs.plan.outputs.benches) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends time clang libicu-dev

      - name: Download vendored toolchains
        uses: actions/download-artifact@v4
        with:
          name: vendor-bundle
          path: vendor/

      - name: Fix permissions
        run: |
          chmod -R +x vendor/hermes/build/bin/ 2>/dev/null || true
          chmod -R +x vendor/hermes/build/lib/ 2>/dev/null || true

      - run: npm ci
      - run: ./scripts/setup.sh

      - name: Record toolchain versions
        run: |
          node --version
          bun --version
          deno --version
          clang --version | head -1
          vendor/hermes/build/bin/shermes -version 2>/dev/null | grep -i "Static Hermes" || true
          node harness/run.mjs --list

      - name: Run benchmark
        run: |
          node harness/run.mjs \
            --runners='${{ inputs.runners || 'all' }}' \
            --benches='${{ matrix.bench }}' \
            --runs='${{ inputs.runs || '5' }}' \
            --warmup=1 \
            --timeout=120 \
            --build-timeout=300 \
            --out="results/shards/${{ matrix.bench }}.json"

      # Upload even when a runner takes the job down: the shard is written
      # incrementally, so partial results are still worth keeping.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.bench }}
          path: results/shards/*.json
          retention-days: 14

  publish:
    needs: bench
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - uses: actions/download-artifact@v4
        with:
          path: results/shards
          pattern: shard-*
          merge-multiple: true

      - name: Merge shards and render report
        run: |
          node harness/merge.mjs results/shards results/latest.json
          node harness/report.mjs results/latest.json
          cp results/latest.json site/latest.json
          cp results/REPORT.md site/REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/latest.json
            results/REPORT.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
